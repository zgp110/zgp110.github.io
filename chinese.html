    var p = document.body || document.documentElement;

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];

    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

        s.textContent = await r.text();
        s.removeAttribute('src');

      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

FT STICKY CARD -->\n    <aside class=\"side\" style=\"position:sticky; top:75px; align-self:start; height:calc(100vh - 75px); overflow:auto; padding:46px 40px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:24px;\">\n      <img src=\"db041d1f-24dd-4843-a3f4-c9e0d6fd21ab\" alt=\"张根培\" style=\"width:100%; aspect-ratio:4/5; object-fit:cover; object-position:center 18%; border-radius:12px; display:block;\">\n      <div>\n        <div style=\"font-family:'Noto Serif SC',serif; font-weight:600; font-size:32px; line-height:1.05;\">张根培<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:var(--muted); margin-top:8px; letter-spacing:.3px;\">Genpei Zhang · 中国河南<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n        <span class=\"pill\" style=\"font-size:11.5px; padding:5px 11px; border-radius:6px; background:var(--chip); border:1px solid var(--line); color:var(--fg);\">计算机科学博士 · UW–Madison<\u002Fspan>\n        <span class=\"pill\" style=\"font-size:11.5px; padding:5px 11px; border-radius:6px; background:var(--chip); border:1px solid var(--line); color:var(--accent);\">2026 秋入学<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0; font-size:14px; line-height:1.75; color:var(--muted);\">生成式 AI 与多模态模型。曾任 <span style=\"color:var(--fg);\">卡内基梅隆大学 Xu Lab<\u002Fspan> 访问研究助理。<\u002Fp>\n      <div style=\"height:1px; background:var(--line);\"><\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:15px;\">\n        <a href=\"mailto:genpeizhang2024@gmail.com\" class=\"clink\" style=\"display:flex; align-items:center; gap:13px; color:var(--fg); text-decoration:none; font-size:14px;\"><span class=\"ico\" style=\"color:var(--accent); font-size:17px;\"><svg viewBox=\"0 0 24 24\"><rect width=\"20\" height=\"16\" x=\"2\" y=\"4\" rx=\"2\"><\u002Frect><path d=\"m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>邮箱<\u002Fa>\n        <a href=\"https://zgp110.github.io/file/CV-GenpeiZHANG.pdf\" class=\"clink\" style=\"display:flex; align-items:center; gap:13px; color:var(--fg); text-decoration:none; font-size:14px;\"><span class=\"ico\" style=\"color:var(--accent); font-size:17px;\"><svg viewBox=\"0 0 24 24\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"><\u002Fpath><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\u002Fpath><path d=\"M10 9H8\"><\u002Fpath><path d=\"M16 13H8\"><\u002Fpath><path d=\"M16 17H8\"><\u002Fpath><\u002Fsvg><\u002Fspan>简历 CV<\u002Fa>\n        <a href=\"https://github.com/zgp110\" class=\"clink\" style=\"display:flex; align-items:center; gap:13px; color:var(--fg); text-decoration:none; font-size:14px;\"><span class=\"ico solid\" style=\"color:var(--accent); font-size:17px;\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.605-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.5 11.5 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.91 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222 0 1.606-.014 2.898-.014 3.293 0 .322.216.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12\"><\u002Fpath><\u002Fsvg><\u002Fspan>GitHub<\u002Fa>\n        <a href=\"https://scholar.google.com/citations?user=CcyuL08AAAAJ\" class=\"clink\" style=\"display:flex; align-items:center; gap:13px; color:var(--fg); text-decoration:none; font-size:14px;\"><span class=\"ico\" style=\"color:var(--accent); font-size:17px;\"><svg viewBox=\"0 0 24 24\"><path d=\"M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z\"><\u002Fpath><path d=\"M22 10v6\"><\u002Fpath><path d=\"M6 12.5V16a6 3 0 0 0 12 0v-3.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>谷歌学术<\u002Fa>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <!-- RIGHT CONTENT -->\n    <main style=\"padding:52px 60px 72px; min-width:0;\">\n\n      <!-- 01 关于我 -->\n      <section style=\"animation:fadeUp .55s ease both;\">\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:22px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); letter-spacing:2px;\">01<\u002Fspan><span style=\"font-size:12px; color:var(--muted); letter-spacing:5px;\">关于我<\u002Fspan><\u002Fdiv>\n        <h1 style=\"margin:0 0 28px; font-family:'Noto Serif SC',serif; font-weight:500; font-size:37px; line-height:1.32; letter-spacing:.5px; max-width:15em;\">让生成式 AI 与多模态模型，学会观察与推理。<\u002Fh1>\n        <p style=\"margin:0 0 17px; font-size:16px; line-height:1.95;\">欢迎来到我的主页！我是 <b style=\"font-weight:600;\">张根培<\u002Fb>，来自中国河南。我本科就读于 <a class=\"ilink\" href=\"https://www.uestc.edu.cn/\">电子科技大学（UESTC）<\u002Fa> 电子信息工程专业，并于 2025 年 6 月毕业；已获 <a class=\"ilink\" href=\"https://www.wisc.edu/\">威斯康星大学麦迪逊分校（UW–Madison）<\u002Fa> 计算机科学博士项目录取，将于 <b style=\"font-weight:600;\">2026 年秋季<\u002Fb> 入学。<\u002Fp>\n        <p style=\"margin:0 0 17px; font-size:16px; line-height:1.95; color:var(--muted);\">本科毕业后，我曾在卡内基梅隆大学 <a class=\"ilink\" href=\"https://xulabs.github.io/\">Xu Lab<\u002Fa> 担任访问研究助理，导师是 <a class=\"ilink\" href=\"https://cbd.cmu.edu/people/xu.html\">Min Xu 教授<\u002Fa>。在那里，我将扩散模型与生物物理知识相结合，用于冷冻电镜（Cryo-EM）图像的合成。我目前的研究重心，正逐渐从科学成像转向更广义的 <b style=\"font-weight:600;\">生成式 AI<\u002Fb>、<b style=\"font-weight:600;\">多模态大语言模型<\u002Fb> 与 <b style=\"font-weight:600;\">图表示学习<\u002Fb>。<\u002Fp>\n        <p style=\"margin:0; font-size:16px; line-height:1.95; color:var(--muted);\">此外，我还与加州大学圣迭戈分校 <a class=\"ilink\" href=\"https://jacobsschool.ucsd.edu/people/profile/nuno-vasconcelos\">Nuno Vasconcelos 教授<\u002Fa> 团队合作，研究隐私感知的计算机视觉；与埃默里大学 <a class=\"ilink\" href=\"https://cs.emory.edu/~lzhao41/\">Liang Zhao 教授<\u002Fa> 团队合作，研究面向三维结构分析的图神经网络；并曾参与哈佛大学 <a class=\"ilink\" href=\"https://seas.harvard.edu/person/pavlos-protopapas\">Pavlos Protopapas 教授<\u002Fa> 及新加坡国立大学 <a class=\"ilink\" href=\"https://www.comp.nus.edu.sg/disa/people/lekhsian/\">Hsiang Hui Lek 博士<\u002Fa> 主持的研究项目。若您对我的研究方向感兴趣，欢迎随时来信交流。<\u002Fp>\n      <\u002Fsection>\n\n      <div style=\"height:1px; background:var(--line); margin:44px 0;\"><\u002Fdiv>\n\n      <!-- 02 研究兴趣 -->\n      <section style=\"animation:fadeUp .55s ease .08s both;\">\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:24px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); letter-spacing:2px;\">02<\u002Fspan><span style=\"font-size:12px; color:var(--muted); letter-spacing:5px;\">研究兴趣<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column;\">\n          <div style=\"display:grid; grid-template-columns:210px 1fr; gap:20px; align-items:baseline; padding:17px 0; border-top:1px solid var(--line);\"><span style=\"font-family:'Noto Serif SC',serif; font-weight:500; font-size:19px;\">生成式 AI<\u002Fspan><span style=\"font-size:15px; color:var(--muted); line-height:1.7;\">扩散模型与可控生成<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:210px 1fr; gap:20px; align-items:baseline; padding:17px 0; border-top:1px solid var(--line);\"><span style=\"font-family:'Noto Serif SC',serif; font-weight:500; font-size:19px;\">多模态大语言模型<\u002Fspan><span style=\"font-size:15px; color:var(--muted); line-height:1.7;\">视觉—语言模型的推理能力<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:210px 1fr; gap:20px; align-items:baseline; padding:17px 0; border-top:1px solid var(--line);\"><span style=\"font-family:'Noto Serif SC',serif; font-weight:500; font-size:19px;\">图表示学习<\u002Fspan><span style=\"font-size:15px; color:var(--muted); line-height:1.7;\">面向表面属性与多面体结构的图<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:210px 1fr; gap:20px; align-items:baseline; padding:17px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);\"><span style=\"font-family:'Noto Serif SC',serif; font-weight:500; font-size:19px;\">AI for Science<\u002Fspan><span style=\"font-size:15px; color:var(--muted); line-height:1.7;\">冷冻电镜 / 冷冻电子断层成像的合成与分析<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <div style=\"height:1px; background:var(--line); margin:44px 0;\"><\u002Fdiv>\n\n      <!-- 03 近期动态 -->\n      <section style=\"animation:fadeUp .55s ease .16s both;\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:26px;\">\n          <div style=\"display:flex; align-items:center; gap:12px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); letter-spacing:2px;\">03<\u002Fspan><span style=\"font-size:12px; color:var(--muted); letter-spacing:5px;\">近期动态<\u002Fspan><\u002Fdiv>\n          <a href=\"publications.html\" class=\"clink\" style=\"display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); text-decoration:none;\">全部论文 <span class=\"ico\" style=\"font-size:14px;\"><svg viewBox=\"0 0 24 24\"><path d=\"M7 7h10v10\"><\u002Fpath><path d=\"M7 17 17 7\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:22px;\">\n          <div style=\"display:grid; grid-template-columns:104px 1fr; gap:20px;\"><span style=\"font-size:13px; color:var(--accent); font-weight:500; padding-top:2px;\">2026 年 6 月<\u002Fspan><span style=\"font-size:15.5px; line-height:1.72;\">论文 <a class=\"ilink\" href=\"https://openreview.net/pdf?id=qdSSzVQttv\">CryoDiff<\u002Fa> 被 <b style=\"font-weight:600;\">CVPR 2026 SynData4CV Workshop<\u002Fb> 接收。<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:104px 1fr; gap:20px;\"><span style=\"font-size:13px; color:var(--accent); font-weight:500; padding-top:2px;\">2026 年 5 月<\u002Fspan><span style=\"font-size:15.5px; line-height:1.72;\">新预印本 <a class=\"ilink\" href=\"https://arxiv.org/abs/2607.16212\">Symbolic Augmentation<\u002Fa> 已发布于 arXiv，研究数值事实核查的鲁棒性。<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:104px 1fr; gap:20px;\"><span style=\"font-size:13px; color:var(--accent); font-weight:500; padding-top:2px;\">2026 年<\u002Fspan><span style=\"font-size:15.5px; line-height:1.72;\">获 <b style=\"font-weight:600;\">威斯康星大学麦迪逊分校计算机科学博士项目<\u002Fb> 录取，将于 2026 年秋季入学。<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:104px 1fr; gap:20px;\"><span style=\"font-size:13px; color:var(--muted); font-weight:500; padding-top:2px;\">2025 年 7 月<\u002Fspan><span style=\"font-size:15.5px; line-height:1.72; color:var(--muted);\">加入卡内基梅隆大学 <a class=\"ilink\" href=\"https://xulabs.github.io/\">Xu Lab<\u002Fa> 担任访问研究助理，研究冷冻电镜图像的生成模型。<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:104px 1fr; gap:20px;\"><span style=\"font-size:13px; color:var(--muted); font-weight:500; padding-top:2px;\">2025 年 5 月<\u002Fspan><span style=\"font-size:15.5px; line-height:1.72; color:var(--muted);\">隐私保护计算机视觉相关工作以 poster 形式被 <a class=\"ilink\" href=\"https://openreview.net/pdf?id=aMXOX8VrNq\">ICML 2025<\u002Fa> 接收。<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:104px 1fr; gap:20px;\"><span style=\"font-size:13px; color:var(--muted); font-weight:500; padding-top:2px;\">2025 年 1 月<\u002Fspan><span style=\"font-size:15.5px; line-height:1.72; color:var(--muted);\">多面体表示学习相关工作以 poster 形式被 <a class=\"ilink\" href=\"https://openreview.net/pdf?id=BpyHIrpUOL\">ICLR 2025<\u002Fa> 接收。<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- QUOTE -->\n      <div style=\"margin-top:52px; padding:34px 40px; background:var(--chip); border:1px solid var(--line); border-radius:14px; position:relative; overflow:hidden;\">\n        <div style=\"position:absolute; top:-18px; left:22px; font-family:'Noto Serif SC',serif; font-size:120px; line-height:1; color:var(--accent); opacity:.13;\">“<\u002Fdiv>\n        <div style=\"position:relative;\">\n          <p style=\"margin:0 0 12px; font-family:'Noto Serif SC',serif; font-weight:500; font-size:24px; line-height:1.7; letter-spacing:1px;\">路漫漫其修远兮，吾将上下而求索。<\u002Fp>\n          <div style=\"font-size:13.5px; color:var(--muted); letter-spacing:1px;\">—— 屈原《离骚》<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <footer style=\"margin-top:56px; padding-top:22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--muted);\">\n        <span>© 2026 张根培 · Genpei Zhang<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;\">genpeizhang2024@gmail.com<\u002Fspan>\n      <\u002Ffooter>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.root = React.createRef();\n    this.LIGHT = { '--bg':'#f6f3ec','--panel':'#fffdf8','--fg':'#1c1a16','--muted':'#6d675c','--line':'#e6e0d3','--accent':'#b1472c','--chip':'#efe9dc' };\n    this.DARK  = { '--bg':'#1a1815','--panel':'#232019','--fg':'#ece8df','--muted':'#9c968a','--line':'#332f27','--accent':'#e0895f','--chip':'#26221b' };\n  }\n\n  componentDidMount() {\n    let saved = 'light';\n    try { saved = localStorage.getItem('gz-theme') || 'light'; } catch (e) {}\n    this.apply(saved, false);\n  }\n\n  apply(mode, save) {\n    const el = this.root.current;\n    if (!el) return;\n    const vars = mode === 'dark' ? this.DARK : this.LIGHT;\n    Object.keys(vars).forEach(k => el.style.setProperty(k, vars[k]));\n    el.setAttribute('data-mode', mode);\n    el.querySelectorAll('[data-role=\"sun\"]').forEach(n => { n.style.display = mode === 'dark' ? 'inline-flex' : 'none'; });\n    el.querySelectorAll('[data-role=\"moon\"]').forEach(n => { n.style.display = mode === 'dark' ? 'none' : 'inline-flex'; });\n    if (save) { try { localStorage.setItem('gz-theme', mode); } catch (e) {} }\n  }\n\n  renderVals() {\n    return {\n      root: this.root,\n      toggle: () => {\n        const el = this.root.current;\n        const cur = (el && el.getAttribute('data-mode')) || 'light';\n        this.apply(cur === 'dark' ? 'light' : 'dark', true);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
